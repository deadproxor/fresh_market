name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - feature/beta
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: # Allows manual trigger via "Run workflow" in GitHub UI

# Global zero-privilege default
permissions: {}

env:
  SUPABASE_CLI_VERSION: '2.66.0'

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    permissions:
      contents: read # Strictly grant read access for checkout step

    steps:
      # Pinned to immutable commit SHA (v4.2.2) to prevent supply-chain attacks
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Pinned to immutable commit SHA (v1.7.3) with locked CLI version
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Validate SUPABASE_ACCESS_TOKEN
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is empty or not set. Generate a Personal Access Token (sbp_...) at https://supabase.com/dashboard/account/tokens and add it in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*)
              echo "SUPABASE_ACCESS_TOKEN format verified (sbp_...)."
              ;;
            *)
              echo "::error::Secret SUPABASE_ACCESS_TOKEN does not start with 'sbp_'. Do not use project anon/service_role JWT keys (eyJ...). Generate an account Personal Access Token (sbp_...) at https://supabase.com/dashboard/account/tokens."
              exit 1
              ;;
          esac

      - name: Deploy cloudinary-destroy
        run: |
          supabase functions deploy cloudinary-destroy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'qifazsptdgcskrchfocc' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy gemini-vision
        run: |
          supabase functions deploy gemini-vision \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'qifazsptdgcskrchfocc' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy admin-settings
        run: |
          supabase functions deploy admin-settings \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'qifazsptdgcskrchfocc' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

