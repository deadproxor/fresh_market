name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - feature/beta
      - main
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: # Allows manual trigger via "Run workflow" in GitHub UI

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.66.0

      - name: Verify Supabase CLI
        run: supabase --version

      - name: Deploy cloudinary-destroy
        run: |
          supabase functions deploy cloudinary-destroy \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'qifazsptdgcskrchfocc' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy gemini-vision
        run: |
          supabase functions deploy gemini-vision \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID || 'qifazsptdgcskrchfocc' }} \
            --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

